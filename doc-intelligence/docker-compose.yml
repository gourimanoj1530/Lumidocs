version: "3.9"

# ─────────────────────────────────────────────
#  AI Document Intelligence Platform
#  Local dev environment — starts with:
#    docker compose up -d
# ─────────────────────────────────────────────

services:

  # ── PostgreSQL 16 + pgvector ──────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16          # official image with pgvector baked in
    container_name: doc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: docdb
      POSTGRES_USER: docuser
      POSTGRES_PASSWORD: docpassword
    ports:
      - "5432:5432"                        # host:container — access from your code as localhost:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data      # data survives restarts
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql  # runs once on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuser -d docdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (cache + rate limiting) ────────────────────────
  redis:
    image: redis:7-alpine
    container_name: doc_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes   # persist data to disk
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── MinIO (S3-compatible file storage) ────────────────────
  minio:
    image: minio/minio:latest
    container_name: doc_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"     # S3 API — your code uploads files here
      - "9001:9001"     # MinIO web UI — open http://localhost:9001 in browser
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO bucket setup (runs once, then exits) ────────────
  minio-init:
    image: minio/mc:latest
    container_name: doc_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin123;
        mc mb --ignore-existing local/documents;
        mc mb --ignore-existing local/thumbnails;
        echo 'Buckets created.';
      "
    restart: "no"                            # run once and done

  # ── pgAdmin (optional visual DB browser) ─────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: doc_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"                            # open http://localhost:5050 in browser
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

# ── Named volumes (Docker manages these on your disk) ─────
volumes:
  postgres_data:
  redis_data:
  minio_data:
  pgadmin_data:
