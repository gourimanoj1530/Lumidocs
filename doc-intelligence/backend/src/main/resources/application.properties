# ─────────────────────────────────────────────────────────
#  application.properties
#  All values here can be overridden by environment variables
#  e.g. SPRING_DATASOURCE_URL overrides spring.datasource.url
# ─────────────────────────────────────────────────────────

# Server
server.port=8080

gemini.api-key=YOUR_GEMINI_API_KEY_HERE
groq.api-key=YOUR_GROQ_API_KEY_HERE

# ── PostgreSQL ────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/docdb
spring.datasource.username=docuser
spring.datasource.password=docpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# validate = checks your entity classes match the DB schema (init.sql already created it)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── MinIO ─────────────────────────────────────────────────
minio.endpoint=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin123
minio.bucket.documents=documents
minio.bucket.thumbnails=thumbnails

# ── File upload limits ────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ── App settings ──────────────────────────────────────────
app.jwt.secret=change-this-to-a-long-random-string-in-production
app.jwt.expiration-hours=24

# ── Logging ───────────────────────────────────────────────
logging.level.com.docplatform=DEBUG
logging.level.org.springframework.security=INFO